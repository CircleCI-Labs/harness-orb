version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.5.0
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  harness: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  # Builds this repo's credential-free test-fixture plugin image locally, then exercises the
  # `harness/plugin` COMMAND (create-output-file -> map-env -> run-plugin -> collect-outputs)
  # against it inline among native steps, proving the whole chain works without any vendor
  # credentials.
  test_plugin_command:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Build credential-free test-fixture plugin image
          command: docker build -t harness-orb-test-fixture:ci ./test-fixtures/plugin
      - harness/plugin:
          image: harness-orb-test-fixture:ci
          pull: false
          settings: |
            message: hello from CircleCI
            greeting: konnichiwa
      - run:
          name: Assert the plugin's output landed in $BASH_ENV
          command: |
            if [ "${GREETING_ECHOED:-}" != "konnichiwa" ]; then
              echo "GREETING_ECHOED was '${GREETING_ECHOED:-<unset>}', expected 'konnichiwa'" >&2
              exit 1
            fi
            if [ "${PLUGIN_RESULT:-}" != "ok" ]; then
              echo "PLUGIN_RESULT was '${PLUGIN_RESULT:-<unset>}', expected 'ok'" >&2
              exit 1
            fi
            echo "Plugin outputs correctly exported into \$BASH_ENV: GREETING_ECHOED=${GREETING_ECHOED} PLUGIN_RESULT=${PLUGIN_RESULT}"
      - run:
          name: Assert the workspace file the plugin wrote is readable and not root-owned
          command: |
            test -f plugin-wrote-this.txt
            cat plugin-wrote-this.txt
            owner_uid="$(stat -c %u plugin-wrote-this.txt 2>/dev/null || stat -f %u plugin-wrote-this.txt)"
            if [ "${owner_uid}" != "$(id -u)" ]; then
              echo "plugin-wrote-this.txt is owned by uid ${owner_uid}, expected $(id -u) (the job user) - ownership fix-up did not work" >&2
              exit 1
            fi

  # Regression test for a fixed CRITICAL bug: run-plugin.sh compared boolean orb parameters
  # against the literal strings "1"/"0", but CircleCI actually renders them as "true"/"false" -
  # so `pull` (default true) and `privileged` never took effect no matter what a caller set.
  # This escaped the test_plugin_command / "Testing Overriding Executor" jobs above because both
  # pass `pull: false` explicitly and neither exercises `privileged: true`, which coincidentally
  # matches the bug's always-false behavior. Exercises run-plugin.sh directly (no real docker
  # daemon interaction needed) with a fake `docker` shimmed onto $PATH that just records its own
  # argv, so this is fast, deterministic, and needs no vendor credentials or network access.
  test_run_plugin_booleans:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Regression test - pull/privileged booleans actually reach `docker run`
          command: |
            set -euo pipefail
            fakebin="$(mktemp -d)"
            call_log="$(mktemp)"
            printf '#!/bin/bash\necho "$@" >>"${DOCKER_CALL_LOG}"\n' >"${fakebin}/docker"
            chmod +x "${fakebin}/docker"

            workspace="$(mktemp -d)"
            output_file="$(mktemp)"
            env_file="$(mktemp)"

            run_case() {
              : >"${call_log}"
              PATH="${fakebin}:${PATH}" \
                DOCKER_CALL_LOG="${call_log}" \
                ORB_VAL_IMAGE="test/image" \
                ORB_VAL_ENV_FILE="${env_file}" \
                ORB_VAL_WORKSPACE_PATH="${workspace}" \
                ORB_VAL_CONTAINER_WORKSPACE_PATH="/harness" \
                ORB_VAL_OUTPUT_FILE="${output_file}" \
                ORB_VAL_CONTAINER_OUTPUT_FILE="/harness-orb-output.env" \
                ORB_VAL_PRIVILEGED="$1" \
                ORB_VAL_PULL="$2" \
                ORB_VAL_ADDITIONAL_DOCKER_FLAGS="" \
                bash src/scripts/run-plugin.sh
            }

            run_case "true" "true"
            if ! grep -qx "pull test/image" "${call_log}"; then
              echo "FAIL: pull: true did not invoke 'docker pull' - got:" >&2
              cat "${call_log}" >&2
              exit 1
            fi
            if ! grep -q -- "--privileged" "${call_log}"; then
              echo "FAIL: privileged: true did not add --privileged to docker run - got:" >&2
              cat "${call_log}" >&2
              exit 1
            fi
            echo "OK: privileged: true and pull: true both took effect."

            run_case "false" "false"
            if grep -q "^pull " "${call_log}"; then
              echo "FAIL: pull: false still invoked 'docker pull' - got:" >&2
              cat "${call_log}" >&2
              exit 1
            fi
            if grep -q -- "--privileged" "${call_log}"; then
              echo "FAIL: privileged: false still added --privileged to docker run - got:" >&2
              cat "${call_log}" >&2
              exit 1
            fi
            echo "OK: privileged: false and pull: false both correctly did nothing."

  # Gap-closing test: a FAILING plugin must fail with its own exit code, not get swallowed or
  # coerced to some other value by run-plugin.sh's own post-run ownership-fixup logic, which
  # runs unconditionally "regardless of whether the plugin succeeded" per that script's own
  # comments and must not clobber a genuine plugin failure. Exercises the real credential-free
  # test-fixture image (built locally) via src/scripts/run-plugin.sh directly -- the actual
  # script, not a faked docker binary -- so this proves the real propagation path end-to-end.
  # PLUGIN_FAIL is a test-fixture-only escape hatch (see test-fixtures/plugin/entrypoint.sh);
  # it is not a real Drone/Harness plugin settings key.
  test_plugin_failure_propagation:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Build credential-free test-fixture plugin image
          command: docker build -t harness-orb-test-fixture:ci ./test-fixtures/plugin
      - run:
          name: Regression test - a failing plugin's own exit code reaches the job unchanged
          command: |
            set -euo pipefail
            workspace="$(mktemp -d)"
            output_file="$(mktemp)"
            env_file="$(mktemp)"
            printf 'PLUGIN_FAIL=42\n' >"${env_file}"

            set +e
            ORB_VAL_IMAGE="harness-orb-test-fixture:ci" \
              ORB_VAL_ENV_FILE="${env_file}" \
              ORB_VAL_WORKSPACE_PATH="${workspace}" \
              ORB_VAL_CONTAINER_WORKSPACE_PATH="/harness" \
              ORB_VAL_OUTPUT_FILE="${output_file}" \
              ORB_VAL_CONTAINER_OUTPUT_FILE="/harness-orb-output.env" \
              ORB_VAL_PRIVILEGED="false" \
              ORB_VAL_PULL="false" \
              ORB_VAL_ADDITIONAL_DOCKER_FLAGS="" \
              bash src/scripts/run-plugin.sh
            actual_exit=$?
            set -e

            if [ "${actual_exit}" -ne 42 ]; then
              echo "FAIL: expected run-plugin.sh to exit 42 (the fixture's own PLUGIN_FAIL exit code), got ${actual_exit}" >&2
              exit 1
            fi
            echo "OK: a failing plugin's own exit code (42) reached the job unchanged, and the post-run ownership fix-up did not mask it."

  # Gap-closing test: map-env.sh's input-shape/validation branches had zero direct CI coverage.
  # Exercises the real script directly (with the real `circleci` CLI on PATH, as on any actual
  # CircleCI job image, so `circleci env subst` runs for real) against a battery of ORB_VAL_SETTINGS
  # shapes: valid ones (hyphenated key, boolean-looking value, comma-joined list, nested-map JSON),
  # and invalid ones (a key containing a space, and malformed JSON starting with '{'). Also pins
  # down a real, current edge case worth documenting explicitly: an empty settings VALUE can never
  # be expressed today, because this script trims trailing whitespace off the whole line before
  # checking for the "key: value" colon-space separator, so "key: " (empty value) collapses to
  # "key:" and is rejected as "not 'key: value'" rather than accepted as key="".
  test_map_env_hostile_and_shapes:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Ensure python3 is present (map-env.sh's JSON-validation dependency)
          command: |
            command -v python3 >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y python3)
      - run:
          name: Valid shapes - hyphenated key, boolean-looking value, list, nested-map JSON
          command: |
            set -euo pipefail
            env_file="$(mktemp)"
            ORB_VAL_ENV_FILE="${env_file}" \
              ORB_VAL_CONTAINER_WORKSPACE_PATH="/harness" \
              ORB_VAL_CONTAINER_OUTPUT_FILE="/harness-orb-output.env" \
              ORB_VAL_SETTINGS=$'repo-url: https://example.com/x\nenabled: true\ntags: a,b,c\nwith: {"a":"b"}' \
              bash src/scripts/map-env.sh

            assert_line() {
              if ! grep -qx "$1" "${env_file}"; then
                echo "FAIL: expected line '$1' in derived env-file, got:" >&2
                cat "${env_file}" >&2
                exit 1
              fi
            }
            assert_line "PLUGIN_REPO_URL=https://example.com/x"
            assert_line "PLUGIN_ENABLED=true"
            assert_line "PLUGIN_TAGS=a,b,c"
            assert_line 'PLUGIN_WITH={"a":"b"}'
            echo "OK: hyphenated key, boolean-looking value, list, and nested-map JSON all mapped correctly."
      - run:
          name: Invalid shape - a settings key containing a space is rejected, not silently mangled
          command: |
            set -eu
            env_file="$(mktemp)"
            set +e
            error_output="$(ORB_VAL_ENV_FILE="${env_file}" \
              ORB_VAL_CONTAINER_WORKSPACE_PATH="/harness" \
              ORB_VAL_CONTAINER_OUTPUT_FILE="/harness-orb-output.env" \
              ORB_VAL_SETTINGS=$'bad key: value' \
              bash src/scripts/map-env.sh 2>&1)"
            actual_exit=$?
            set -e
            if [ "${actual_exit}" -eq 0 ]; then
              echo "FAIL: expected map-env.sh to reject a settings key containing a space, but it exited 0" >&2
              exit 1
            fi
            case "${error_output}" in
              *"does not produce a valid env var name"*) ;;
              *)
                echo "FAIL: expected the 'does not produce a valid env var name' error, got:" >&2
                echo "${error_output}" >&2
                exit 1
                ;;
            esac
            echo "OK: a settings key containing a space is rejected with a clear error."
      - run:
          name: Invalid shape - malformed JSON-looking value is rejected before reaching the plugin
          command: |
            set -eu
            env_file="$(mktemp)"
            set +e
            error_output="$(ORB_VAL_ENV_FILE="${env_file}" \
              ORB_VAL_CONTAINER_WORKSPACE_PATH="/harness" \
              ORB_VAL_CONTAINER_OUTPUT_FILE="/harness-orb-output.env" \
              ORB_VAL_SETTINGS=$'bad_json: {not valid}' \
              bash src/scripts/map-env.sh 2>&1)"
            actual_exit=$?
            set -e
            if [ "${actual_exit}" -eq 0 ]; then
              echo "FAIL: expected map-env.sh to reject malformed JSON-looking settings.bad_json, but it exited 0" >&2
              exit 1
            fi
            case "${error_output}" in
              *"failed to parse as JSON"*) ;;
              *)
                echo "FAIL: expected the 'failed to parse as JSON' error, got:" >&2
                echo "${error_output}" >&2
                exit 1
                ;;
            esac
            echo "OK: malformed JSON-looking settings value is rejected with a clear, key-specific error."
      - run:
          name: Documented edge case - an empty settings value can never be expressed today
          command: |
            set -eu
            env_file="$(mktemp)"
            set +e
            error_output="$(ORB_VAL_ENV_FILE="${env_file}" \
              ORB_VAL_CONTAINER_WORKSPACE_PATH="/harness" \
              ORB_VAL_CONTAINER_OUTPUT_FILE="/harness-orb-output.env" \
              ORB_VAL_SETTINGS=$'note: ' \
              bash src/scripts/map-env.sh 2>&1)"
            actual_exit=$?
            set -e
            if [ "${actual_exit}" -eq 0 ]; then
              echo "FAIL: expected map-env.sh to reject a trailing-whitespace-only value line, but it exited 0 - if this now succeeds, map-env.sh's empty-value handling changed and this test (and the README, if it documents this gap) should be updated accordingly" >&2
              exit 1
            fi
            case "${error_output}" in
              *"is not 'key: value'"*) ;;
              *)
                echo "FAIL: expected the 'is not key: value' error, got:" >&2
                echo "${error_output}" >&2
                exit 1
                ;;
            esac
            echo "OK (documented gap, not a bug fix here): an empty settings value collapses to 'key:' after trailing-whitespace trim and is rejected, exactly as today's map-env.sh behaves."

  # Gap-closing test: prove two chained `harness/plugin` calls in the same job (the pattern the
  # README's "chained plugins" guidance implies is safe) keep their own output-file/env-file pairs
  # independent and uncorrupted, as long as the caller gives each call distinct file paths.
  test_plugin_idempotency:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Build credential-free test-fixture plugin image
          command: docker build -t harness-orb-test-fixture:ci ./test-fixtures/plugin
      - harness/plugin:
          image: harness-orb-test-fixture:ci
          pull: false
          output-file: /tmp/harness-orb/output-first.env
          env-file: /tmp/harness-orb/plugin-first.env
          settings: |
            message: first call
            greeting: bonjour
      - harness/plugin:
          image: harness-orb-test-fixture:ci
          pull: false
          output-file: /tmp/harness-orb/output-second.env
          env-file: /tmp/harness-orb/plugin-second.env
          settings: |
            message: second call
            greeting: hola
      - run:
          name: Assert both calls' output-file/env-file pairs stayed independent and uncorrupted
          command: |
            set -euo pipefail
            assert_contains() {
              if ! grep -qx "$2" "$1"; then
                echo "FAIL: expected '$2' in $1, got:" >&2
                cat "$1" >&2
                exit 1
              fi
            }
            assert_contains /tmp/harness-orb/output-first.env "GREETING_ECHOED=bonjour"
            assert_contains /tmp/harness-orb/output-second.env "GREETING_ECHOED=hola"
            assert_contains /tmp/harness-orb/plugin-first.env "PLUGIN_MESSAGE=first call"
            assert_contains /tmp/harness-orb/plugin-second.env "PLUGIN_MESSAGE=second call"
            # $BASH_ENV is job-scoped and append-only (documented behavior, not a bug): the second
            # call's export of the same verbatim key (GREETING_ECHOED) is the one a later native
            # step now sees.
            if [ "${GREETING_ECHOED:-}" != "hola" ]; then
              echo "FAIL: expected \$BASH_ENV to reflect the second call's GREETING_ECHOED='hola' (last-exported wins), got '${GREETING_ECHOED:-<unset>}'" >&2
              exit 1
            fi
            echo "OK: two chained harness/plugin calls in one job kept independent output-file/env-file pairs uncorrupted, and \$BASH_ENV reflects the second (latest) call as documented."

  # Regression test for the reserved-variable denylist in collect-outputs.sh -- a plugin
  # container could plant an output line named PATH/BASH_ENV/etc. and hijack every later
  # native step that sources $BASH_ENV (see that script's own "SECURITY" comment). This
  # is the single highest-value coverage gap identified in the release-readiness audit:
  # the denylist existed but had zero direct regression coverage. Exercises the real
  # script directly against a hand-written fixture output file -- no docker, no
  # credentials -- mirroring the sibling bitrise orb's
  # test-collect-outputs-hijack-regression job.
  test_collect_outputs_reserved_var_denylist:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Regression test - a plugin's PATH/BASH_ENV output lines are refused, not exported
          command: |
            set -euo pipefail
            output_file="$(mktemp)"
            {
              echo "PATH=./evilbin:/usr/bin:/bin"
              echo "BASH_ENV=/tmp/pwned-by-plugin.sh"
              echo "LD_PRELOAD=/tmp/evil.so"
              echo "SAFE_OUTPUT=this_one_is_fine"
            } > "${output_file}"
            bash_env_file="$(mktemp)"
            rm -f /tmp/pwned-by-plugin.sh

            warning_output="$(BASH_ENV="${bash_env_file}" ORB_VAL_OUTPUT_FILE="${output_file}" bash src/scripts/collect-outputs.sh 2>&1)"
            echo "${warning_output}"

            for reserved in PATH BASH_ENV LD_PRELOAD; do
              if grep -q "^export ${reserved}=" "${bash_env_file}"; then
                echo "FAIL: '${reserved}' was exported into \$BASH_ENV -- the reserved-variable denylist did not block it:" >&2
                cat "${bash_env_file}" >&2
                exit 1
              fi
            done
            if ! grep -q "^export SAFE_OUTPUT=" "${bash_env_file}"; then
              echo "FAIL: SAFE_OUTPUT (a legitimate, non-reserved output) was not exported -- the denylist is too broad:" >&2
              cat "${bash_env_file}" >&2
              exit 1
            fi
            case "${warning_output}" in
              *"reserved variable 'PATH'"*) ;;
              *)
                echo "FAIL: expected a warning naming the reserved variable 'PATH', got:" >&2
                echo "${warning_output}" >&2
                exit 1
                ;;
            esac
            echo "OK: PATH/BASH_ENV/LD_PRELOAD output lines were all refused with a warning; SAFE_OUTPUT still exported normally."

  # Genuinely complex/high-value target, per the release-readiness brief: a real,
  # published, credential-free Drone/Harness plugin (plugins/github-actions) that itself
  # runs Docker-in-Docker to emulate a GitHub Action -- the hardest case this orb
  # supports (privileged: true, nested docker, a real third-party action pulled from
  # GitHub, all with zero credentials). Proves --privileged genuinely reaches a
  # real-world plugin that needs it, not just the synthetic boolean-plumbing check in
  # test_run_plugin_booleans above.
  # NOTE, verified hands-on while adding this test: plugins/github-actions (the example
  # in src/examples/privileged_plugin.yml) does NOT work as a real CI target on
  # CircleCI's machine executor -- it shells out to `act` with `--container-options
  # "-v=/:/"`, and Docker refuses that exact bind-mount ("invalid mount config for type
  # 'bind': invalid specification: destination can't be '/'") on a real machine
  # executor. This is a genuine incompatibility in that specific plugin's own act
  # invocation, not a bug in this orb -- the example stays in src/examples/ as
  # documentation of the real settings shape, but plugins/docker below is the real
  # privileged/DinD CI target instead, since it hits the identical --privileged code
  # path (a plugin that needs its own nested Docker daemon) without that plugin-specific
  # act/bind-mount incompatibility.
  test_plugin_docker_privileged_complex_target:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Write a throwaway Dockerfile for plugins/docker to build
          command: |
            printf 'FROM alpine:3.20\nCMD ["echo", "built by plugins/docker via harness-orb"]\n' > Dockerfile
      - harness/plugin:
          image: plugins/docker
          privileged: true
          settings: |
            dry_run: true
            repo: harness-orb-ci/dry-run-image
            tags: latest
          step-name: "Run plugins/docker (privileged, real nested Docker build, dry_run -- no registry, no credentials)"

workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - test_plugin_command:
          filters: *filters
      - test_run_plugin_booleans:
          filters: *filters
      - test_plugin_failure_propagation:
          filters: *filters
      - test_map_env_hostile_and_shapes:
          filters: *filters
      - test_plugin_idempotency:
          filters: *filters
      - test_collect_outputs_reserved_var_denylist:
          filters: *filters
      - test_plugin_docker_privileged_complex_target:
          filters: *filters
      - harness/plugin:
          name: "Testing Overriding Executor"
          image: alpine/git
          pull: false
          settings: |
            message: not used by alpine/git, just checking the container starts
          additional-docker-flags: --entrypoint sh
          executor:
            name: harness/default
            image: ubuntu-2404:current
            resource_class: medium
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *filters
          requires:
            - test_plugin_command
            - test_run_plugin_booleans
            - test_plugin_failure_propagation
            - test_map_env_hostile_and_shapes
            - test_plugin_idempotency
            - test_collect_outputs_reserved_var_denylist
            - test_plugin_docker_privileged_complex_target
            - "Testing Overriding Executor"
      - orb-tools/publish:
          name: "Publish Dev"
          orb_name: cci-labs/harness
          vcs_type: << pipeline.project.type >>
          pub_type: dev
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
          context: orb-publishing
          release_environment: orbs-dev
          github_token: GHI_TOKEN
      - orb-tools/publish:
          name: "Publish Production"
          orb_name: cci-labs/harness
          vcs_type: << pipeline.project.type >>
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
          context: orb-publishing
          filters: *release-filters
          release_environment: orbs-prod
          github_token: GHI_TOKEN
