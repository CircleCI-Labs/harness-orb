version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.3.0
  shellcheck: circleci/shellcheck@3.1

filters: &filters
  tags:
    only: /.*/

jobs:
  check-cli-version:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Install CircleCI CLI
          command: curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/master/install.sh | bash
      - run:
          name: Check CircleCI CLI version floor (>= 1.0.48254)
          command: bash scripts/check-circleci-cli-version.sh

workflows:
  lint-pack:
    jobs:
      - check-cli-version:
          filters: *filters
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
          requires: [check-cli-version]
      # Ignore RC010
      - orb-tools/review:
          filters: *filters
          exclude: "RC010"
      - shellcheck/check:
          filters: *filters
          severity: error
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: harness
          requires: [orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check]
          filters: *filters
