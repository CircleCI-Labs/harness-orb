description: >
  Default executor for running a Harness/Drone plugin container. Must be `machine`, not
  `docker` + setup_remote_docker: plugin containers need a real bind-mount of the checkout
  (setup_remote_docker's Docker host is a separate machine and cannot bind-mount the job's
  filesystem - see CircleCI's own Docker Compose volume-mounting docs), and some plugins
  require --privileged, which the docker executor and self-hosted Container Runner both disallow.

parameters:
  image:
    type: string
    default: ubuntu-2404:current
    description: The machine image to run the plugin container on.
  docker_layer_caching:
    type: boolean
    default: false
    description: >
      Enable CircleCI's Docker Layer Caching. DLC caches `docker build` layer output; it is not a
      cache for `docker pull`. This orb never builds an image (it only pulls and runs a pre-built
      vendor plugin image), so DLC has nothing of its own to cache here -- confirmed by
      measurement, not just mechanism: against plugins/docker (~208MB), two independent
      real-CircleCI runs showed no measurable pull-time improvement from DLC, while DLC itself
      added ~3s of spin-up/teardown overhead on top of its billed, plan-gated cost. Defaults to
      false accordingly. See docs/ROADMAP.md's "Image caching economics" section for the measured
      numbers and job references, and docs/LIMITS.md's "Caching the plugin image" section for
      user-facing guidance, including the one case (your own `pre-steps`/`post-steps` building an
      image) where DLC would genuinely help.
  resource_class:
    type: string
    default: medium
    description: Resource class for the executor.

machine:
  image: << parameters.image >>
  docker_layer_caching: << parameters.docker_layer_caching >>
resource_class: << parameters.resource_class >>
